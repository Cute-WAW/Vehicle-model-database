services:
  web:
    build: .
    container_name: car_price_predictor
    ports:
      - "8087:8087"
    volumes:
      - ./output:/app/output
      - ./users.sqlite:/app/users.sqlite
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    command: /bin/sh -c "pip install -i https://pypi.tuna.tsinghua.edu.cn/simple captcha && python src/web_predictor_debug_step5.py --port 8087 --host 0.0.0.0"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: unless-stopped
