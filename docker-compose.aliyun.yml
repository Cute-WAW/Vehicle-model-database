services:
  web:
    build: .
    image: car-price-predictor-img:latest
    container_name: car_price_predictor_web
    expose:
      - "8087"
    volumes:
      - ./output:/app/output
      - ./users.sqlite:/app/users.sqlite
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
    command: /bin/sh -c "pip install -i https://pypi.tuna.tsinghua.edu.cn/simple captcha && python src/web_predictor_debug_step5.py --port 8087 --host 0.0.0.0"
    restart: always

  nginx:
    image: nginx:latest
    container_name: car_price_predictor_nginx
    ports:
      - "8096:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: always
