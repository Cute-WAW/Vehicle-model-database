
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 车型库映射系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page register-page">
    <!-- Animated Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>创建新账号</h1>
        </div>
        
        <form id="registerForm" novalidate>
            <div class="form-group" id="usernameGroup">
                <label for="username">用户名 *</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" required placeholder="请输入用户名 (用于登录)">
                    <i class="fas fa-user"></i>
                </div>
                <div class="error-message">请输入用户名</div>
            </div>
            
            <div class="form-group" id="passwordGroup">
                <label for="password">密码 *</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required placeholder="请输入密码 (至少6位)">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="error-message">请输入密码 (至少6位)</div>
            </div>
            
            <div class="form-group" id="confirmPasswordGroup">
                <label for="confirm_password">确认密码 *</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入密码">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="error-message">两次输入的密码不一致</div>
            </div>
            
            <div class="form-group" id="emailGroup">
                <label for="email">邮箱</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="请输入邮箱 (可选)">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
            
            <div class="form-group" id="nicknameGroup">
                <label for="nickname">昵称</label>
                <div class="input-wrapper">
                    <input type="text" id="nickname" name="nickname" placeholder="请输入昵称 (可选)">
                    <i class="fas fa-id-card"></i>
                </div>
            </div>
            
            <button type="submit" class="btn-full" id="registerBtn">
                <span>立即注册</span>
                <div class="btn-spinner"></div>
            </button>
            
            <div class="message" id="message"></div>
        </form>
        
        <div class="form-footer">
            已有账号？ <a href="/login">立即登录</a>
            <br><br>
            <span style="font-size: 12px; color: #999;">&copy; 2026 车型库映射系统</span>
        </div>
    </div>

    <script>
        // Validation helpers
        function validateRequired(input, group, msg = '此项不能为空') {
            if (!input.value.trim()) {
                group.querySelector('.error-message').textContent = msg;
                group.classList.add('error');
                return false;
            }
            group.classList.remove('error');
            return true;
        }

        function validateLength(input, group, min, msg) {
            if (input.value.length < min) {
                group.querySelector('.error-message').textContent = msg;
                group.classList.add('error');
                return false;
            }
            group.classList.remove('error');
            return true;
        }

        function validateMatch(input1, input2, group, msg) {
            if (input1.value !== input2.value) {
                group.querySelector('.error-message').textContent = msg;
                group.classList.add('error');
                return false;
            }
            group.classList.remove('error');
            return true;
        }

        // Real-time validation
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');

        usernameInput.addEventListener('input', () => validateRequired(usernameInput, document.getElementById('usernameGroup'), '请输入用户名'));
        passwordInput.addEventListener('input', () => validateLength(passwordInput, document.getElementById('passwordGroup'), 6, '密码长度至少6位'));
        confirmInput.addEventListener('input', () => validateMatch(passwordInput, confirmInput, document.getElementById('confirmPasswordGroup'), '两次密码不一致'));

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameGroup = document.getElementById('usernameGroup');
            const passwordGroup = document.getElementById('passwordGroup');
            const confirmGroup = document.getElementById('confirmPasswordGroup');
            const emailInput = document.getElementById('email');
            const nicknameInput = document.getElementById('nickname');
            
            // Validate all
            let isValid = true;
            isValid = validateRequired(usernameInput, usernameGroup) && isValid;
            isValid = validateLength(passwordInput, passwordGroup, 6, '密码长度至少6位') && isValid;
            isValid = validateMatch(passwordInput, confirmInput, confirmGroup, '两次密码不一致') && isValid;
            
            if (!isValid) return;

            const btn = document.getElementById('registerBtn');
            const messageEl = document.getElementById('message');

            // Reset UI
            messageEl.className = 'message';
            messageEl.textContent = '';
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                // Minimum loading time
                const minLoadTime = new Promise(resolve => setTimeout(resolve, 800));

                const registerRequest = fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value,
                        email: emailInput.value || null,
                        nickname: nicknameInput.value || '新用户'
                    })
                });
                
                const [response] = await Promise.all([registerRequest, minLoadTime]);
                const result = await response.json();
                
                if (result.success) {
                    messageEl.textContent = '注册成功！正在跳转登录页...';
                    messageEl.classList.add('success', 'show');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    messageEl.textContent = '注册失败: ' + result.message;
                    messageEl.classList.add('error', 'show');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            } catch (e) {
                console.error(e);
                messageEl.textContent = '请求失败，请检查网络或稍后重试';
                messageEl.classList.add('error', 'show');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
