<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 车型库映射系统</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: #333;
            margin: 0;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-register:hover {
            background-color: #1976D2;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }
        .message.error {
            color: #d9534f;
        }
        .message.success {
            color: #4CAF50;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #888;
        }
        .footer a {
            color: #2196F3;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>新用户注册</h1>
        </div>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名 *</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名 (用于登录)">
            </div>
            <div class="form-group">
                <label for="password">密码 *</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="confirm_password">确认密码 *</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入密码">
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱 (可选)">
            </div>
            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" name="nickname" placeholder="请输入昵称 (可选)">
            </div>
            
            <button type="submit" class="btn-register" id="registerBtn">立即注册</button>
            <div class="message" id="message"></div>
        </form>
        <div class="footer">
            已有账号？ <a href="/login">去登录</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const email = document.getElementById('email').value;
            const nickname = document.getElementById('nickname').value;
            
            const messageEl = document.getElementById('message');
            const btn = document.getElementById('registerBtn');
            
            // 简单验证
            if (password !== confirmPassword) {
                messageEl.textContent = '两次输入的密码不一致';
                messageEl.className = 'message error';
                return;
            }
            
            messageEl.textContent = '注册中...';
            messageEl.className = 'message';
            btn.disabled = true;
            btn.textContent = '提交中...';
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        email: email || null,
                        nickname: nickname || '新用户'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageEl.textContent = '注册成功！正在跳转登录页...';
                    messageEl.className = 'message success';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    messageEl.textContent = '注册失败: ' + result.message;
                    messageEl.className = 'message error';
                    btn.disabled = false;
                    btn.textContent = '立即注册';
                }
            } catch (e) {
                console.error(e);
                messageEl.textContent = '请求失败，请检查网络或稍后重试';
                messageEl.className = 'message error';
                btn.disabled = false;
                btn.textContent = '立即注册';
            }
        });
    </script>
</body>
</html>
